name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  embedded:
    name: Embedded build (thumbv7em, no_std)
    runs-on: ubuntu-latest
    # Vérifie le cœur seul — linalg, sp, scalar. Les sondes hôte (io, binaire de
    # benchmark, dépendance regex) sont exclues par construction : `io` est gaté
    # sur la feature `std`, le binaire déclare `required-features = ["std"]`, et
    # `regex` est une dépendance optionnelle activée par cette même feature.
    # Si ce job casse, c'est que du code hôte a fuité dans le cœur.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build for Cortex-M (no heap, no std)
        run: cargo build --target thumbv7em-none-eabihf --no-default-features
      - name: Build for Cortex-M with alloc (gros tenseurs de benchmark)
        run: cargo build --target thumbv7em-none-eabihf --no-default-features --features alloc
      - name: Core builds no_std on host (signal rapide)
        run: cargo build --no-default-features --lib

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
        continue-on-error: true
